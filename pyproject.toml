[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceforge"
version = "0.15.0"
description = "Framework-Agnostic Execution Replay & Analysis Platform: traces, spans, events, replay engine, diff analysis, exporters, and HTTP gateway."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "TraceForge contributors" }]
keywords = ["tracing", "observability", "execution-replay", "diff-engine", "sdk", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "PyJWT>=2.8.0",
]

[project.scripts]
traceforge = "traceforge.cli.main:cli_entry"

[project.optional-dependencies]
websocket = ["websockets>=12.0"]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Omarkam3l/Trace"
Documentation = "https://github.com/Omarkam3l/Trace/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["traceforge"]

[tool.hatch.build.targets.sdist]
include = [
    "/traceforge",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
