[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceforge"
version = "0.1.0"
description = "A framework-agnostic execution-tracing SDK: traces, spans, events, and context propagation with pluggable storage and exporters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "TraceForge contributors" }]
keywords = ["tracing", "observability", "spans", "async", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
websocket = ["websockets>=12.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/traceforge/traceforge"
Documentation = "https://github.com/traceforge/traceforge/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["traceforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
