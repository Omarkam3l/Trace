name: Production CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Stage 1 - Ruff Linter Check
        run: |
          ruff check traceforge/

      - name: Stage 2 - Formatter Check
        run: |
          ruff format --check traceforge/

      - name: Stage 3 - MyPy Type Checker
        run: |
          mypy traceforge/

      - name: Stage 4 - Pytest Suite
        run: |
          pytest --cov=traceforge

      - name: Stage 5 - Frontend Build Verification
        run: |
          test -f traceforge/gateway/static/index.html

      - name: Stage 6 - Python Package Build
        run: |
          python -m pip install build
          python -m build

      - name: Stage 7 - Docker Image Build
        run: |
          docker build -t traceforge:v1.0.0 .

      - name: Stage 8 - Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: traceforge-dist
          path: dist/
